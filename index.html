<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>練習管理アプリ</title>
    <link rel="stylesheet" href="./styl.css">
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <h1>練習管理アプリ</h1>
            <p>勝率・試合記録・課題・メモ・練習予定を保存できます</p>
        </header>

        <nav class="app-nav">
            <button class="tab-button active" data-section="winrate">勝率</button>
            <button class="tab-button" data-section="matches">試合記録</button>
            <button class="tab-button" data-section="tasks">課題／反省</button>
            <button class="tab-button" data-section="memo">フリーメモ</button>
            <button class="tab-button" data-section="practice">これからの練習</button>
        </nav>

        <main class="app-main">
            <section id="winrate" class="page-section active">
                <h2>勝率</h2>
                <div class="card">
                    <div class="form-actions">
                        <label>表示形式
                            <select id="winrateFilter">
                                <option value="all">すべて</option>
                                <option value="single">シングルス</option>
                                <option value="double">ダブルス</option>
                            </select>
                        </label>
                    </div>
                    <div class="chart-card">
                        <canvas id="winrateChart" aria-label="勝率チャート"></canvas>
                    </div>
                    <div class="summary-row">
                        <p>最新勝率: <strong id="latestWinRate">-</strong></p>
                        <p>総試合数: <strong id="totalMatches">0</strong></p>
                    </div>
                </div>
            </section>

            <section id="matches" class="page-section">
                <h2>試合記録</h2>
                <form id="matchForm" class="record-form">
                    <label>日付<input type="date" id="matchDate" required></label>
                    <label>対戦校<input type="text" id="opponentSchool" placeholder="例: 〇〇高校"></label>
                    <label>対戦相手<input type="text" id="opponentName" placeholder="例: 太郎"></label>
                    <label>試合形式
                        <select id="matchFormat" required>
                            <option value="single">シングルス</option>
                            <option value="double">ダブルス</option>
                        </select>
                    </label>
                    <label id="rubberTypeLabel">戦型
                        <select id="rubberType">
                            <option value="">選択してください</option>
                            <option value="ドライブマン">ドライブマン</option>
                            <option value="カットマン">カットマン</option>
                            <option value="異質ラバー">異質ラバー</option>
                            <option value="その他">その他</option>
                        </select>
                    </label>
                    <div id="doubleRubberTypeFields" class="hidden">
                        <label>自分の戦型
                            <select id="doubleRubberTypeSelf">
                                <option value="">選択してください</option>
                                <option value="ドライブマン">ドライブマン</option>
                                <option value="カットマン">カットマン</option>
                                <option value="異質ラバー">異質ラバー</option>
                                <option value="その他">その他</option>
                            </select>
                        </label>
                        <label>パートナーの戦型
                            <select id="doubleRubberTypePartner">
                                <option value="">選択してください</option>
                                <option value="ドライブマン">ドライブマン</option>
                                <option value="カットマン">カットマン</option>
                                <option value="異質ラバー">異質ラバー</option>
                                <option value="その他">その他</option>
                            </select>
                        </label>
                    </div>
                    <label>結果
                        <select id="matchResult" required>
                            <option value="win">勝ち</option>
                            <option value="lose">負け</option>
                            <option value="draw">引き分け</option>
                        </select>
                    </label>
                    <label>セット数<input type="number" id="totalSets" min="1" max="7" placeholder="例: 4"></label>
                    <div id="pointInputs"></div>
                    <label id="matchNoteLabel"><span>シングルスの反省/課題</span><textarea id="matchNote" rows="3" placeholder="シングルスでの反省点や課題を入力"></textarea></label>
                    <div class="form-actions">
                        <button type="submit" id="matchSubmitButton">記録を保存</button>
                        <button type="button" id="matchCancelButton" class="cancel-button hidden">編集をキャンセル</button>
                    </div>
                </form>
                <div class="list-card">
                    <h3>試合履歴</h3>
                    <ul id="matchList" class="item-list"></ul>
                </div>
            </section>

            <section id="tasks" class="page-section">
                <h2>課題／反省点</h2>
                <div class="list-card">
                    <h3>自動追加された反省・課題</h3>
                    <div class="form-actions">
                        <label>表示形式
                            <select id="taskFormatFilter">
                                <option value="all">すべて</option>
                                <option value="single">シングルス</option>
                                <option value="double">ダブルス</option>
                            </select>
                        </label>
                    </div>
                    <ul id="taskList" class="item-list"></ul>
                </div>
            </section>

            <section id="memo" class="page-section">
                <h2>フリーメモ</h2>
                <div class="form-actions">
                    <label>表示形式
                        <select id="memoFormatFilter">
                            <option value="all">すべて</option>
                            <option value="single">シングルス</option>
                            <option value="double">ダブルス</option>
                        </select>
                    </label>
                </div>
                <form id="memoForm" class="record-form">
                    <label>メモ<textarea id="memoText" rows="4" placeholder="自由にメモできます"></textarea></label>
                    <div class="form-actions">
                        <button type="submit" id="memoSubmitButton">メモを保存</button>
                        <button type="button" id="memoCancelButton" class="cancel-button hidden">編集をキャンセル</button>
                    </div>
                </form>
                <div class="list-card">
                    <h3>保存済みメモ</h3>
                    <ul id="memoList" class="item-list"></ul>
                </div>
            </section>

            <section id="practice" class="page-section">
                <h2>これからの練習</h2>
                <div class="form-actions">
                    <label>表示形式
                        <select id="practiceFormatFilter">
                            <option value="all">すべて</option>
                            <option value="single">シングルス</option>
                            <option value="double">ダブルス</option>
                        </select>
                    </label>
                </div>
                <form id="practiceForm" class="record-form">
                    <label>練習内容<textarea id="practiceText" rows="4" placeholder="次の練習でやりたいこと"></textarea></label>
                    <div class="form-actions">
                        <button type="submit" id="practiceSubmitButton">予定を保存</button>
                        <button type="button" id="practiceCancelButton" class="cancel-button hidden">編集をキャンセル</button>
                    </div>
                </form>
                <div class="list-card">
                    <h3>練習予定</h3>
                    <ul id="practiceList" class="item-list"></ul>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./script.js"></script>
</body>
</html>
